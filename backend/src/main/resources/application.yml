server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kskbl?stringtype=unspecified}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  ai:
    model:
      chat: openai
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          temperature: 0.7
          max-tokens: 1200
